[project]
name = "earth-empire-backend"
version = "1.0.0"
description = "Earth Empire backend: API, analysis with Claude, X and Facebook posters"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "boto3>=1.34",
  "cryptography>=42",
  "requests>=2.32",
  "requests-oauthlib>=2.0",
  "watchtower>=3.0",
  "playwright>=1.48",
  "tzdata",
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "fastembed>=0.4",
  "faster-whisper>=1.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ee = "ee.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["ee"]
