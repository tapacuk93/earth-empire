name: EarthEmpire
options:
  bundleIdPrefix: com.oeaio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    # The team id is public (it is in every apple-app-site-association file); signing
    # certificates and profiles stay on the build machine.
    DEVELOPMENT_TEAM: HTS38ZPRVH
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_PREVIEWS: YES
    SUPPORTS_MACCATALYST: NO
    # On Apple silicon Macs the iPad app runs as "Designed for iPad".
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES

targets:
  EarthEmpire:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: EarthEmpire/Sources
      - path: EarthEmpire/Resources
      # The development fixture (CONTRACT.md shapes + gradient media), kept as a folder so media
      # keys resolve to Fixture/media/<key>.
      - path: Fixture
        type: folder
        buildPhase: resources
    info:
      path: EarthEmpire/Info.plist
      properties:
        CFBundleDisplayName: Earth Empire
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        EEAPIBase: https://api.empire.earth
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.photography
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        CFBundleURLTypes:
          - CFBundleURLName: com.oeaio.earthempire
            CFBundleURLSchemes: [earthempire]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: EarthEmpire/EarthEmpire.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:empire.earth
          - applinks:www.empire.earth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.earthempire
        PRODUCT_NAME: Earth Empire
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: [EarthEmpireTests, EarthEmpireUITests]
      gatherCoverageData: false

  # Decoding of the contract's shapes and the paging logic. Hosted by the app.
  EarthEmpireTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests
    dependencies:
      - target: EarthEmpire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.earthempire.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Earth Empire.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Earth Empire"
        BUNDLE_LOADER: "$(TEST_HOST)"

  # The main flows on the sample fixture (`-EESample YES`): no network.
  EarthEmpireUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: EarthEmpire
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oeaio.earthempire.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: EarthEmpire
