[project]
name = "earth-empire-monitor"
version = "0.1.0"
description = "Earth Empire monitor: official accounts' public videos, transcribed, searched for phrases and out-of-place Ukrainian/Russian"
requires-python = ">=3.11"
dependencies = [
  "faster-whisper>=1.1",     # MIT
  "av<16",                   # BSD-3 (faster-whisper's decoder; 16+ breaks its open() call)
  "yt-dlp",                  # Unlicense
  "fastapi>=0.115",          # MIT
  "uvicorn[standard]>=0.30", # BSD-3
  "httpx>=0.27",             # BSD-3
  "boto3>=1.34",             # Apache-2.0
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
ee-monitor = "eemonitor.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["eemonitor", "eemonitor.platforms"]
